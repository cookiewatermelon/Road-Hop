<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Road Hop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2b44;--panel:rgba(255,255,255,.95);--mute:#5d6b86;--sun:#ffc93c;--sunInk:#3a2a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef2ff;--panel:rgba(25,33,54,.95);--mute:#a9b4d0}}
:root[data-theme="dark"]{--ink:#eef2ff;--panel:rgba(25,33,54,.95);--mute:#a9b4d0}
html,body{height:100%;margin:0}
body{background:#9fe0f2;font-family:Fredoka,"Trebuchet MS",sans-serif;color:var(--ink);overflow:hidden;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);text-align:center}
.hide{display:none!important}
h1{font-size:clamp(52px,13vw,92px);margin:0 0 8px;line-height:.95;font-weight:700;color:#fff;text-shadow:0 6px 0 #1d2b44,0 10px 20px rgba(0,0,0,.25)}
h2{margin:0;font-weight:700}
button{font:inherit;font-weight:700;font-size:22px;border:0;border-radius:18px;padding:14px 34px;min-width:220px;background:var(--sun);color:var(--sunInk);box-shadow:0 6px 0 #c9921a;cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #c9921a}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button.alt{background:var(--panel);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.tip{color:#fff;margin:6px 0 0;font-weight:500;text-shadow:0 2px 0 rgba(29,43,68,.7)}
.card{background:var(--panel);border-radius:26px;padding:20px 24px;box-shadow:0 10px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px;align-items:center;box-sizing:border-box}
#chars .card{width:min(92vw,640px);padding:18px 16px}
#pv{width:100%;height:230px;display:block}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.g button{min-width:0;padding:10px 4px;font-size:18px;background:var(--panel);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.3);border:2px solid var(--mute)}
.g button[aria-pressed="true"]{background:var(--sun);color:var(--sunInk);box-shadow:0 4px 0 #c9921a;border-color:#c9921a}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(29,43,68,.75)}
#sc{font-size:60px;line-height:1}#bs{font-size:24px}
#over{background:rgba(20,30,50,.35)}
#bar{width:min(70vw,320px);height:16px;border-radius:9px;background:rgba(255,255,255,.55);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#ff9a2e;transition:width .15s}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" class="hide"><span id="sc">0</span><span id="bs"></span></div>
<div id="load" class="ov" style="background:#9fe0f2;color:#1d2b44"><div id="lt" style="font-size:26px;font-weight:700">Setting up the road…</div><div id="bar"><i></i></div></div>
<div id="menu" class="ov hide"><h1>Road Hop</h1><button id="play">Play</button><button id="chb" class="alt">Characters</button><p class="tip">Arrow keys or WASD to hop. On touch screens, tap to hop forward or swipe.</p></div>
<div id="chars" class="ov hide"><div class="card"><h2>Choose your hopper</h2><canvas id="pv"></canvas><div class="g" id="g"></div><button id="back">Done</button></div></div>
<div id="over" class="ov hide"><div class="card"><h2 style="font-size:40px">Game over</h2><div id="why" style="color:var(--mute)"></div><div id="fs" style="font-size:68px;line-height:1;font-weight:700">0</div><div>Best <b id="fb">0</b></div><b id="nb" class="hide" style="color:#e07a00">New best!</b><button id="again">Play again</button><button id="home" class="alt">Main menu</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),R=Math.random,pick=a=>a[R()*a.length|0],show=(id,on)=>$(id).classList.toggle('hide',!on);
const LS={get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
if(!window.THREE){$('lt').textContent='Couldn’t load the 3D engine. Check your connection and reload.';return}
let best=+LS.get('rh-best',0),sel=+LS.get('rh-char',0)%4,state='load',score=0;
const prog=p=>$('bar').firstChild.style.width=p+'%';
const MC={},GC={},S=.9,W=15;
const mat=c=>MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}));
const geo=(w,h,d)=>{const k=w+','+h+','+d;return GC[k]||(GC[k]=new THREE.BoxGeometry(w,h,d))};
const B=(g,w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(geo(w,h,d),mat(c));m.position.set(x,y,z);g.add(m);return m};

// ---------- characters (face -z) ----------
function char(t){const g=new THREE.Group(),f=(w,h,d,c,x,y,z)=>B(g,w,h,d,c,x,y,z),E=(x,y,z)=>f(.07,.07,.02,0x111111,x,y,z);
 if(t<2){const sk=0xf2c9a0,sh=t?0xff6fa5:0x3d7be0,hr=t?0x6b3a1e:0x3a2415,pn=t?sk:0x2b3a67;
  f(.17,.3,.18,pn,-.13,.15,0);f(.17,.3,.18,pn,.13,.15,0);
  if(t)f(.56,.2,.34,0xb04fd0,0,.32,0);
  f(.5,.36,.28,sh,0,.48,0);f(.13,.3,.15,sh,-.33,.5,0);f(.13,.3,.15,sh,.33,.5,0);
  f(.4,.36,.36,sk,0,.84,0);f(.44,.12,.4,hr,0,1.04,.02);
  if(t){f(.44,.42,.1,hr,0,.85,.21);f(.1,.1,.1,0xff3d7f,-.22,1.03,-.16)}
  E(-.1,.86,-.19);E(.1,.86,-.19)}
 else{const c=t===2?0xf0a04b:0xb98255,d=t===2?0xd9863a:0x7a4a28;
  [[-.13,-.2],[.13,-.2],[-.13,.2],[.13,.2]].forEach(p=>f(.11,.2,.11,d,p[0],.1,p[1]));
  f(.4,.34,.62,c,0,.37,0);f(.4,.36,.36,c,0,.7,-.34);E(-.1,.74,-.53);E(.1,.74,-.53);
  if(t===2){f(.1,.14,.08,d,-.13,.95,-.34);f(.1,.14,.08,d,.13,.95,-.34);f(.07,.05,.02,0xff8fa8,0,.66,-.53);f(.08,.4,.08,d,0,.62,.4)}
  else{f(.1,.26,.14,d,-.25,.68,-.34);f(.1,.26,.14,d,.25,.68,-.34);f(.22,.14,.16,0xf0dcb8,0,.62,-.6);f(.08,.06,.03,0x111111,0,.67,-.69);f(.08,.08,.24,d,0,.52,.4)}}
 return g}

// ---------- world ----------
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fe0f2);
const world=new THREE.Group();scene.add(world);
const rows={},P={x:0,r:0,hop:null,log:null,off:0,dead:0,dt:0};
let maxR=0,genR=-4,lastT=0,run=0,lastD=1,rd,camera,pl,cx=0,cz=0;
const VC=[0xe8483f,0xf2b632,0x3d8be0,0xf4f4f4,0x58c06a,0xb552d9];
function veh(tr){const g=new THREE.Group(),c=pick(VC);
 if(tr){B(g,1.6,.8,.8,0xe9eef2,-.4,.6,0);B(g,.75,.6,.8,c,.95,.5,0);B(g,.1,.3,.7,0x9bd3ef,1.33,.62,0);[-1,-.2,.95].forEach(x=>B(g,.4,.3,.9,0x222831,x,.15,0));return{g,w:2.5}}
 B(g,1.2,.38,.7,c,0,.33,0);B(g,.6,.3,.6,0xd6eefb,-.1,.67,0);[-.4,.4].forEach(x=>B(g,.3,.3,.8,0x222831,x,.15,0));return{g,w:1.3}}
function mk(r){
 let t=0;
 if(r>=4){const k=R();t=k<.34?0:k<.7?1:2;if(t===lastT&&run>=3)t=(t+1+(R()*2|0))%3}
 const same=t===lastT,d=same?-lastD:(R()<.5?1:-1);run=same?run+1:1;lastT=t;lastD=d;
 const g=new THREE.Group(),o={r,g,t,d,mv:[],bl:{}};g.position.z=-r;
 if(t===0){B(g,2*W,.3,1,r%2?0x7bd86a:0x6fcf5f,0,-.15,0);
  for(let x=-W;x<=W;x++){const free=Math.abs(x)<=5;if(R()<(free?(r>2?.14:0):.42)){const h=R()<.5?.9:1.3;B(g,.3,.5,.3,0x7a4f2a,x,.25,0);B(g,.85,h,.85,0x2f9e4a,x,.5+h/2,0);if(free)o.bl[x]=1}}}
 else if(t===1){B(g,2*W,.3,1,0x4d5366,0,-.15,0);for(let i=-W+1;i<W;i+=3)B(g,1.1,.02,.08,0xe9edf5,i,.01,.5);
  const sp=2+R()*3.2;
  for(let x=-W+R()*3;x<W;){const v=veh(R()<.3);v.g.rotation.y=d>0?0:Math.PI;g.add(v.g);o.mv.push({g:v.g,x:x+v.w/2,w:v.w,d,s:sp});x+=v.w+2.6+R()*5}}
 else{B(g,2*W,.3,1,0x46b4ea,0,-.3,0);const sp=1+R()*1.8;
  for(let x=-W+R()*2;x<W;){const L=2+(R()*3|0),m=new THREE.Group();B(m,L,.3,.8,0x9a6a38,0,0,0);B(m,L+.06,.18,.7,0xc99a5f,0,0,0);g.add(m);o.mv.push({g:m,x:x+L/2,w:L,d,s:sp,log:1});x+=L+1.2+R()*1.4}
  for(let i=0;i<8;i++){const f=B(g,.7,.02,.07,0xcdeefc,0,-.14,(R()-.5)*.8);o.mv.push({g:f,x:(R()*2-1)*W,w:0,d,s:sp*.7})}}
 return o}
function gen(up){while(genR<up){rows[genR]=mk(genR);world.add(rows[genR].g);genR++}
 for(const k in rows)if(k<maxR-16){world.remove(rows[k].g);delete rows[k]}}
function mvAll(dt){for(const k in rows)for(const m of rows[k].mv){m.x+=m.d*m.s*dt;if(m.x>W+3)m.x-=2*W+6;else if(m.x<-W-3)m.x+=2*W+6;m.g.position.x=m.x}}
function setChar(){if(pl)scene.remove(pl);pl=char(sel);pl.scale.setScalar(S);scene.add(pl)}
function reset(){for(const k in rows){world.remove(rows[k].g);delete rows[k]}
 genR=-4;lastT=0;run=0;lastD=1;maxR=score=0;gen(26);
 Object.assign(P,{x:0,r:0,hop:null,log:null,off:0,dead:0,dt:0});setChar();$('sc').textContent=0;cam(0,1)}

// ---------- gameplay ----------
function move(dx,dr){
 if(state!=='play'||P.dead||P.hop)return;
 pl.rotation.y=dr>0?0:dr<0?Math.PI:dx>0?-Math.PI/2:Math.PI/2;
 const tx=Math.round(P.x)+dx,tr=P.r+dr;
 if(Math.abs(tx)>5||tr<maxR-4)return;
 const o=rows[tr];if(!o||o.bl[tx])return;
 P.hop={fx:P.x,tx,fr:P.r,tr,t:0};P.log=null}
function die(k){if(!P.dead){P.dead=k;P.dt=0;P.hop=null}}
function land(){const o=rows[P.r];
 if(P.r>maxR){maxR=P.r;score=maxR;$('sc').textContent=score;gen(maxR+26)}
 if(o.t===2){const l=o.mv.find(m=>m.log&&Math.abs(m.x-P.x)<m.w/2+.1);if(l){P.log=l;P.off=P.x-l.x}else die('w')}}
function upd(dt){
 if(P.dead){P.dt+=dt;if(P.dead==='c'){pl.scale.set(1.25*S,.12*S,1.25*S);pl.position.y=0}else pl.position.y-=dt*2.5;if(P.dt>.9)over();return}
 if(P.hop){const h=P.hop;h.t+=dt/.15;const k=Math.min(h.t,1);P.x=h.fx+(h.tx-h.fx)*k;
  pl.position.set(P.x,Math.sin(Math.PI*k)*.55,-(h.fr+(h.tr-h.fr)*k));
  if(k>=1){P.hop=null;P.r=h.tr;land()}}
 else{if(P.log){P.x=P.log.x+P.off;if(Math.abs(P.x)>7)die('w')}pl.position.set(P.x,P.log?.15:0,-P.r)}
 const cr=P.hop?(P.hop.t>.5?P.hop.tr:P.hop.fr):P.r,o=rows[cr];
 if(o&&o.t===1&&o.mv.some(m=>Math.abs(m.x-P.x)<m.w/2+.3))die('c')}
function over(){state='over';const nb=score>best;if(nb){best=score;LS.set('rh-best',best)}
 $('fs').textContent=score;$('fb').textContent=best;$('bs').textContent='Best '+best;show('nb',nb);
 $('why').textContent=P.dead==='c'?'A vehicle got you.':'Splash! Land on a log to cross.';show('over',true)}
function start(){show('menu',false);show('over',false);show('chars',false);show('hud',true);reset();state='play'}
function cam(dt,snap){const k=snap?1:1-Math.exp(-5*dt);cx+=(pl.position.x*.35-cx)*k;cz+=(pl.position.z-cz)*k;
 camera.position.set(cx+2,10,cz+6);camera.lookAt(cx,0,cz-2.5)}
function rs(){const w=innerWidth,h=innerHeight,a=w/h;rd.setSize(w,h);
 const hw=Math.min(9.5,Math.max(6.2,6.5*a)),hh=hw/a;
 Object.assign(camera,{left:-hw,right:hw,top:hh,bottom:-hh});camera.updateProjectionMatrix();if(state==='chars')sizePrev()}

// ---------- character preview ----------
let pr,ps,pc;const pch=[];
function initPrev(){pr=new THREE.WebGLRenderer({canvas:$('pv'),antialias:true,alpha:true});pr.setPixelRatio(Math.min(devicePixelRatio,2));
 ps=new THREE.Scene();ps.add(new THREE.AmbientLight(0xffffff,.8));const l=new THREE.DirectionalLight(0xffffff,.7);l.position.set(-3,6,6);ps.add(l);
 for(let i=0;i<4;i++){const c=char(i);c.position.x=(i-1.5)*2.2;ps.add(c);pch.push(c)}
 pc=new THREE.OrthographicCamera(-4.4,4.4,3,-3,.1,50);pc.position.set(0,2.5,10);pc.lookAt(0,1,0);
 ['Male','Female','Cat','Dog'].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{sel=i;LS.set('rh-char',i);mark()};$('g').appendChild(b)});mark()}
function mark(){[...$('g').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===sel))}
function sizePrev(){const v=$('pv'),w=v.clientWidth,h=v.clientHeight;pr.setSize(w,h,false);pc.top=4.4*h/w;pc.bottom=-pc.top;pc.updateProjectionMatrix()}

// ---------- input & UI ----------
const KM={arrowup:[0,1],w:[0,1],arrowdown:[0,-1],s:[0,-1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
addEventListener('keydown',e=>{const m=KM[e.key.toLowerCase()];if(m){e.preventDefault();move(m[0],m[1])}});
let ts;addEventListener('touchstart',e=>{ts=e.touches[0]},{passive:true});
addEventListener('touchend',e=>{if(state!=='play'||!ts)return;const t=e.changedTouches[0],dx=t.clientX-ts.clientX,dy=t.clientY-ts.clientY;
 if(Math.hypot(dx,dy)<24)move(0,1);else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy<0?1:-1)});
$('play').onclick=start;$('again').onclick=start;
$('chb').onclick=()=>{state='chars';show('menu',false);show('chars',true);sizePrev()};
$('back').onclick=()=>{state='menu';show('chars',false);show('menu',true);setChar();pl.position.set(0,0,0)};
$('home').onclick=()=>{show('over',false);show('hud',false);reset();state='menu';show('menu',true)};
addEventListener('resize',()=>rd&&rs());

let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 mvAll(dt);
 if(state==='play')upd(dt);else if(state==='menu')pl.position.y=Math.abs(Math.sin(now/280))*.1;
 cam(dt);rd.render(scene,camera);
 if(state==='chars'){const t=now/1000;pch.forEach((c,i)=>{const s=i===sel;c.rotation.y=Math.PI+Math.sin(t*1.6+i)*.55;c.position.y=s?Math.abs(Math.sin(t*4))*.3:0;c.scale.setScalar(s?2.35:2)});pr.render(ps,pc)}}

// ---------- boot with progress ----------
$('bs').textContent='Best '+best;
const steps=[
 ()=>{rd=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));
  camera=new THREE.OrthographicCamera(-9,9,6,-6,.1,100);scene.add(new THREE.AmbientLight(0xffffff,.78));
  const sun=new THREE.DirectionalLight(0xffffff,.65);sun.position.set(-4,10,6);scene.add(sun);rs()},
 ()=>reset(),
 ()=>initPrev(),
 ()=>requestAnimationFrame(loop)];
let i=0;(function nx(){steps[i++]();prog(i*25);
 if(i<steps.length)setTimeout(nx,180);else setTimeout(()=>{show('load',false);state='menu';show('menu',true)},300)})();
})();
</script></body></html>
